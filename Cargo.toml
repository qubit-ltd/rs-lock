[package]
name = "qubit-lock"
version = "0.11.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-lock"
description = "Lock utilities library providing synchronous, asynchronous, and monitor-based locking primitives"
homepage = "https://github.com/qubit-ltd/rs-lock"
documentation = "https://docs.rs/qubit-lock"
readme = "README.md"
keywords = ["lock", "mutex", "rwlock", "monitor", "async"]
categories = ["concurrency", "asynchronous"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/benches/**",
    "/doc/**",
    "/examples/**",
    "/src/**",
    "/tests/**",
]

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[lib]
name = "qubit_lock"
doctest = true

[features]
default = ["monitor", "parking-lot"]
async-lock = ["dep:tokio", "tokio/sync"]
async-monitor = ["async-lock", "monitor", "tokio/time", "qubit-clock/tokio"]
loom-model = ["monitor", "dep:loom"]
monitor = ["dep:qubit-clock", "dep:qubit-collections"]
parking-lot = ["dep:parking_lot"]

[dependencies]
parking_lot = { version = "0.12", optional = true }
loom = { version = "0.7", optional = true }
tokio = { version = "1.52", default-features = false, optional = true }
qubit-clock = { version = "0.10", optional = true }
qubit-collections = { version = "0.1", optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
qubit-clock = { version = "0.10", features = ["test-util"] }
semver = { version = "1.0", default-features = false }
tokio = { version = "1.52", default-features = false, features = ["macros", "rt-multi-thread", "test-util", "time"] }

[[example]]
name = "clone_test"
required-features = ["monitor", "parking-lot"]

[[bench]]
name = "tokio_monitor_cancellation"
harness = false
required-features = ["async-monitor"]

[[bench]]
name = "blocking_monitor"
harness = false
required-features = ["monitor", "parking-lot"]

[[bench]]
name = "blocking_wait_registration"
harness = false
required-features = ["monitor", "parking-lot"]

[[bench]]
name = "waiter_registry"
harness = false
required-features = ["monitor"]
